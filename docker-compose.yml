services:
  summa:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - summa-data:/data
    environment:
      - SUMMA_DB_PATH=${SUMMA_DB_PATH:-/data/db/summa.db}
      - SUMMA_DNA_REPO=${SUMMA_DNA_REPO:-/data/dna}
      # JWT secret must be set and at least 32 characters (validated at startup)
      - SUMMA_JWT_SECRET=${SUMMA_JWT_SECRET:?JWT secret must be set}
      - SUMMA_CORS_ORIGINS=${SUMMA_CORS_ORIGINS:-}
      - SUMMA_SPEND_CEILING=${SUMMA_SPEND_CEILING:-1000000}
      - SUMMA_GIT_BRANCH=${SUMMA_GIT_BRANCH:-main}
      - SUMMA_LOCAL_AUTH_ENABLED=${SUMMA_LOCAL_AUTH_ENABLED:-true}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  console:
    build:
      context: .
      dockerfile: Dockerfile.console
      args:
        # Baked into the Vite bundle at build time — override for non-default setups.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUMMA_MODE: ${VITE_SUMMA_MODE:-single-process}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      summa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  summa-data:
