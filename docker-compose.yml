services:
  summa:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - summa-data:/data
    environment:
      - SUMMA_DB_PATH=${SUMMA_DB_PATH:-/data/db/summa.db}
      - SUMMA_DNA_REPO=${SUMMA_DNA_REPO:-/data/dna}
      # JWT secret must be set and at least 32 characters (validated at startup)
      - SUMMA_JWT_SECRET=${SUMMA_JWT_SECRET:?JWT secret must be set}
      - SUMMA_JWT_EXPIRATION=${SUMMA_JWT_EXPIRATION:-86400}
      - SUMMA_CORS_ORIGINS=${SUMMA_CORS_ORIGINS:-}
      - SUMMA_SPEND_CEILING=${SUMMA_SPEND_CEILING:-1000000}
      - SUMMA_GIT_BRANCH=${SUMMA_GIT_BRANCH:-main}
      - SUMMA_LOCAL_AUTH_ENABLED=${SUMMA_LOCAL_AUTH_ENABLED:-true}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # Node config
      - SUMMA_NODE_LEASE_INTERVAL=${SUMMA_NODE_LEASE_INTERVAL:-30}
      - SUMMA_NODE_HEARTBEAT_TIMEOUT=${SUMMA_NODE_HEARTBEAT_TIMEOUT:-90}
      - SUMMA_NODE_AFFINITY_STARVATION=${SUMMA_NODE_AFFINITY_STARVATION:-3600}
      # Spawn config
      - SUMMA_SPAWN_EPH_TOKEN_TTL=${SUMMA_SPAWN_EPH_TOKEN_TTL:-24}
      - SUMMA_SPAWN_MAX_CONCURRENT=${SUMMA_SPAWN_MAX_CONCURRENT:-10}
      - SUMMA_SPAWN_MAX_AGENTS=${SUMMA_SPAWN_MAX_AGENTS:-100}
      - SUMMA_SPAWN_DEPTH_CAP=${SUMMA_SPAWN_DEPTH_CAP:-2}
      - SUMMA_SPAWN_BUDGET_WINDOW=${SUMMA_SPAWN_BUDGET_WINDOW:-7}
      # Ask SLA config
      - SUMMA_ASKS_CRITICAL_DEADLINE=${SUMMA_ASKS_CRITICAL_DEADLINE:-24}
      - SUMMA_ASKS_STANDARD_DEADLINE=${SUMMA_ASKS_STANDARD_DEADLINE:-72}
      - SUMMA_ASKS_BULK_DEADLINE=${SUMMA_ASKS_BULK_DEADLINE:-168}
      - SUMMA_ASKS_STORM_COLLAPSE=${SUMMA_ASKS_STORM_COLLAPSE:-1}
      - SUMMA_ASKS_RATE_LIMIT=${SUMMA_ASKS_RATE_LIMIT:-60}
      # DNA config
      - SUMMA_DNA_REVIEW_SLA=${SUMMA_DNA_REVIEW_SLA:-7}
      # Spend config
      - SUMMA_CRITICAL_FLOOR_PERCENT=${SUMMA_CRITICAL_FLOOR_PERCENT:-50}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  console:
    build:
      context: .
      dockerfile: Dockerfile.console
      args:
        # Baked into the Vite bundle at build time — override for non-default setups.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SUMMA_MODE: ${VITE_SUMMA_MODE:-single-process}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      summa:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  summa-data:
