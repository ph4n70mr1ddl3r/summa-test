version: '3.9'

services:
  summa:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - summa-data:/data
    environment:
      - SUMMA_DB_PATH=/data/db/summa.db
      - SUMMA_DNA_REPO=/data/dna
      - SUMMA_JWT_SECRET=${SUMMA_JWT_SECRET:?SUMMA_JWT_SECRET must be set}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  console:
    build:
      context: console
      dockerfile: ../Dockerfile.console
    ports:
      - "3000:80"
    depends_on:
      summa:
        condition: service_healthy

volumes:
  summa-data:
