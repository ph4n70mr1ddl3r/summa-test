services:
  lint-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint spec suite
        run: python tools/lint_specs.py
      - name: Linter self-tests
        run: python tools/test_lint.py

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build backend
        run: cd backend && mvn -q -DskipTests package
      - name: Run backend tests
        run: cd backend && mvn test

  console-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install console deps
        run: cd console && npm ci
      - name: Build console
        run: cd console && npm run build
      - name: Run console tests
        run: cd console && npm test

  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build backend on ${{ matrix.os }}
        run: cd backend && mvn -q -DskipTests package
        shell: bash
