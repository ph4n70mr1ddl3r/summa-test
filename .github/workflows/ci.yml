name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb2b236 # v8.0.0
        with:
          python-version: "3.12"
      - name: Lint spec suite
        run: python3 tools/lint_specs.py
      - name: Linter self-tests
        run: python3 tools/test_lint.py

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@ea9168ab9e68c032329b734079aa7659c7470fd5 # v4.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test backend
        run: cd backend && mvn -B test -Dspring.profiles.active=test

  console-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@60edd82690a3795cde5a47e1b07b50043fca0743 # v6.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install console deps
        run: cd console && npm ci
      - name: Lint console
        run: cd console && npm run lint
      - name: Build console
        run: cd console && npm run build
      - name: Run console tests
        run: cd console && npm test

  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@ea9168ab9e68c032329b734079aa7659c7470fd5 # v4.0.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test backend on ${{ matrix.os }}
        run: cd backend && mvn -B test -Dspring.profiles.active=test
        shell: bash

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e0c296a9b2f0782b08d # v3.0.0
      - name: Build backend Docker image
        run: docker build -f Dockerfile -t summa-backend:test .
      - name: Build console Docker image
        run: docker build -f Dockerfile.console -t summa-console:test .
