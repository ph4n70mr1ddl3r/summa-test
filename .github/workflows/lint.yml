name: spec-lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint spec suite
        run: python3 tools/lint_specs.py
      - name: Linter self-tests
        run: python3 tools/test_lint.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            command: cd backend && mvn test
          - service: console
            command: cd console && npm test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend tests
        if: matrix.service == 'backend'
        run: cd backend && mvn test
      - name: Run console tests
        if: matrix.service == 'console'
        run: cd console && npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: cd backend && mvn package -DskipTests
      - name: Build console
        run: cd console && npm run build
