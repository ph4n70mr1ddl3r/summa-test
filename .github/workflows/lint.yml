name: spec-lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint spec suite
        run: python tools/lint_specs.py
      - name: Linter self-tests
        run: python tools/test_lint.py
