spring:
  datasource:
    url: jdbc:h2:mem:summatest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        hbm2ddl.auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

logging:
  level:
    com.summa: DEBUG
    org.springframework: INFO
