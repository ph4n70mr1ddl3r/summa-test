spring:
  datasource:
    url: jdbc:h2:mem:summatest;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.eclipse.persistence.platform.database.H2Platform
    properties:
      eclipselink:
        target-database: h2
        ddl-generation: create-tables-drop-tables
        ddl-generation-output-mode: both
    show-sql: false
  sql:
    init:
      mode: never

summa:
  database:
    path: target/test-db.db
    wal-mode: true

logging:
  level:
    com.summa: DEBUG
    org.springframework: INFO
