server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: summa
  datasource:
    url: jdbc:sqlite:${SUMMA_DB_PATH:${user.home}/.summa/summa.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.eclipse.persistence.platform.database.SQLiteDialect
    properties:
      eclipselink:
        jdbc:
          batch-writing: delayed
        batching:
          size: 50
        jpa:
          convertors: com.summa.config.InstantToUnixEpochConverter
      eclipselink.cache.shared.default: false
  sql:
    init:
      mode: never
  main:
    allow-bean-definition-overriding: false

summa:
  mode: ${SUMMA_MODE:single-process}
  cors:
    origins: ${SUMMA_CORS_ORIGINS:}
  database:
    path: ${SUMMA_DB_PATH:${user.home}/.summa/summa.db}
    wal-mode: true
  git:
    dna-repo-path: ${SUMMA_DNA_REPO:${user.home}/.summa/dna}
    branch: ${SUMMA_GIT_BRANCH:main}
    commit-author: summa <summa@local>
  auth:
    jwt-secret: ${SUMMA_JWT_SECRET}
    local-auth-enabled: ${SUMMA_LOCAL_AUTH_ENABLED:true}
    jwt-expiration: ${SUMMA_JWT_EXPIRATION:86400000}
    pat-default-expiry-days: 90
  node:
    lease-interval-seconds: ${SUMMA_NODE_LEASE_INTERVAL:30}
    heartbeat-timeout-seconds: ${SUMMA_NODE_HEARTBEAT_TIMEOUT:90}
    affinity-starvation-hours: ${SUMMA_NODE_AFFINITY_STARVATION:24}
  spawn:
    ephemeral-default-ttl-hours: ${SUMMA_SPAWN_EPH_TOKEN_TTL:24}
    ephemeral-max-concurrent-per-spawner: ${SUMMA_SPAWN_MAX_CONCURRENT:3}
    org-wide-max-active-agents: ${SUMMA_SPAWN_MAX_AGENTS:100}
    depth-cap: ${SUMMA_SPAWN_DEPTH_CAP:2}
    budget-window-days: ${SUMMA_SPAWN_BUDGET_WINDOW:30}
  asks:
    tier-critical-deadline-hours: ${SUMMA_ASKS_CRITICAL_DEADLINE:1}
    tier-standard-deadline-hours: ${SUMMA_ASKS_STANDARD_DEADLINE:24}
    tier-bulk-deadline-hours: ${SUMMA_ASKS_BULK_DEADLINE:24}
    storm-collapse-window-hours: ${SUMMA_ASKS_STORM_COLLAPSE:1}
    rate-limit-per-source-per-hour: ${SUMMA_ASKS_RATE_LIMIT:60}
  dna:
    default-review-sla-days: ${SUMMA_DNA_REVIEW_SLA:7}
    injection-layers:
      org-snapshot-token-budget: 1000
      glossary-token-budget: 2000
      rules-token-budget: 4000
      goal-slice-token-budget: 1000
  spend:
    ceiling: ${SUMMA_SPEND_CEILING:1000000}
    critical-floor-percent: ${SUMMA_CRITICAL_FLOOR_PERCENT:5}

logging:
  level:
    com.summa: INFO
    org.springframework.security: INFO
    org.eclipse.persistence: WARN
