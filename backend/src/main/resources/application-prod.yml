server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,text/html,application/xml
    min-response-size: 1024

spring:
  datasource:
    url: jdbc:sqlite:${SUMMA_DB_PATH:/data/db/summa.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.eclipse.persistence.platform.database.SQLiteDialect
    show-sql: false
    properties:
      eclipselink:
        jdbc:
          batch-writing: delayed
        batching:
          size: 50
        jpa:
          convertors: com.summa.config.InstantToUnixEpochConverter
        show-sql: false
      eclipselink.cache.shared.default: false
  sql:
    init:
      mode: never

summa:
  mode: single-process
  database:
    path: ${SUMMA_DB_PATH:/data/db/summa.db}
    wal-mode: true
  git:
    dna-repo-path: ${SUMMA_DNA_REPO:/data/dna}
    branch: main
    commit-author: summa <summa@local>
  auth:
    jwt-secret: ${SUMMA_JWT_SECRET}
    jwt-expiration: 86400000
    pat-default-expiry-days: 90
  node:
    lease-interval-seconds: 30
    heartbeat-timeout-seconds: 90
    affinity-starvation-hours: 24
  spawn:
    ephemeral-default-ttl-hours: 24
    ephemeral-max-concurrent-per-spawner: 3
    org-wide-max-active-agents: 100
    depth-cap: 2
    budget-window-days: 30
  asks:
    tier-critical-deadline-hours: 1
    tier-standard-deadline: next-digest
    tier-bulk-deadline-hours: 24
    storm-collapse-window-hours: 1
    rate-limit-per-source-per-hour: 60
  dna:
    default-review-sla-days: 7
    injection-layers:
      org-snapshot-token-budget: 1000
      glossary-token-budget: 2000
      rules-token-budget: 4000
      goal-slice-token-budget: 1000
  spend:
    org-ceiling: ${SUMMA_SPEND_CEILING:1000000}
    critical-floor-percent: 5

logging:
  level:
    com.summa: INFO
    org.springframework.security: WARN
    org.hibernate: ERROR
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} [%thread] %-5level %logger{36} - %msg%n"
